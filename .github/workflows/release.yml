name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      # 配置了签名私钥才生成应用内更新所需的签名与 latest.json；未配置时照常出安装包，客户端退回「前往下载」
      - name: 判断是否生成应用内更新包
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          fi

      # tauri.conf.json 的 beforeBuildCommand 会先执行 npm run build（含类型检查）
      - name: 构建安装包并创建草稿 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ steps.updater.outputs.args }}
          tagName: v__VERSION__
          releaseName: Yachiyo Chat v__VERSION__
          releaseBody: |
            下载下方的 `.exe`（推荐）或 `.msi` 安装包。

            安装包暂未进行代码签名，首次运行时如出现 SmartScreen 提示，请点击“更多信息 → 仍要运行”。
          releaseDraft: true
          prerelease: false
