[package]
name = "yachiyo-desktop"
version = "0.1.0"
description = "Yachiyo Desktop App"
authors = ["amtale"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "yachiyo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
png = "0.17"
log = "0.4"
url = "2"
rfd = "0.15"
encoding_rs = "0.8"
regex = "1"
# 规范化路径返回给界面时去掉 Windows 的 \\?\ 前缀
dunce = "1"
tauri-plugin-updater = "~2.12"
tauri-plugin-process = "~2.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# UI Automation：枚举前台窗口的可点击元素，避免模型靠猜坐标点击
uiautomation = "0.25"

# 受管命令以独立进程组启动，取消与超时时整组终止
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
